name: Update README

on:
  schedule:
    - cron: '0 0 * * *'  # runs every day at midnight UTC
  workflow_dispatch:       # allows manual trigger from GitHub UI

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create cache directory
        run: mkdir -p cache

      - name: Run today.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: PeterTheDeveloper
        run: python today.py

      - name: Commit and push changes
        run: |
          git config --global user.email "Peterrosejr@gmail.com"
          git config --global user.name "PeterTheDeveloper"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Update README with latest stats"
          git push
