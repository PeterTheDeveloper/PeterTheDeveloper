  <text x="250" y="90" class="text">OS: <tspan class="accent">iOS, Android, Web</tspan></text>
  <text x="250" y="110" class="text">Role: <tspan class="accent">Software Engineer</tspan></text>
  <text x="250" y="130" class="text">Company: <tspan class="accent">The Relva Company</tspan></text>

  <text x="250" y="170" class="text">Languages:</text>
  <text x="270" y="195" class="text">- JS / React Native / Expo</text>
  <text x="270" y="215" class="text">- Swift (iOS Native)</text>

